[project]
name = "bass-karaoke-player"
version = "0.1.0"
description = "A web-based karaoke/music player with stem splitting, pitch/tempo control"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "bass-karaoke-player contributors" }]
keywords = ["music", "karaoke", "stems", "demucs", "rubberband"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "fastapi==0.138.1",
    "uvicorn[standard]==0.49.0",
    "python-multipart==0.0.32",
    "aiofiles==25.1.0",
    "pydantic==2.13.4",
    "demucs==4.0.1",
]

[project.optional-dependencies]
# GPU-accelerated audio decoding – only needed in the Docker runtime image.
# torchcodec requires CUDA libs provided by nvidia-npp on Linux.
gpu = [
    "torchcodec==0.14.0",
    "nvidia-npp==13.1.2.48",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.15.20",
    "mypy==2.1.0",
    "types-aiofiles==25.1.0.20260518",
    "playwright==1.60.0",
    "pytest-playwright==0.8.0",
]

[tool.uv]
required-version = ">=0.11.8"
package = false

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
asyncio_mode = "auto"
addopts = "--cov=backend/app --cov-report=term-missing --cov-report=xml --cov-fail-under=95"

[tool.ruff]
line-length = 88
target-version = "py314"
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.14"
strict = true
ignore_missing_imports = true
explicit_package_bases = true
